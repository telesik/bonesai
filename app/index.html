<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Bonesai</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23182a21'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <span class="brand-name">Bonesai</span>
          <span id="round-chip" class="round-chip"></span>
        </div>
        <div id="status" class="status">
          <div id="status-event" class="status-event"></div>
          <div id="status-prompt" class="status-prompt"></div>
        </div>
        <div class="topbar-right">
          <select id="lang-select" class="lang-select"></select>
          <button id="btn-sound" class="icon-btn muted">♪</button>
          <button id="btn-orient" class="icon-btn">▯</button>
          <button id="btn-hist" class="icon-btn" data-tip="История ходов: перемотка сыгранных партий">⧗</button>
          <button id="btn-mark" class="icon-btn" data-tip="Разметить принадлежность ходов: кости первого игрока светлее, второго — темнее">◐</button>
          <button id="btn-fit" class="icon-btn" data-tip="Показать всю фигуру целиком (или двойной клик по столу)">⌖</button>
          <button id="btn-new" class="icon-btn" data-tip="Начать новый матч">⟳</button>
        </div>
      </header>
      <section id="hand-top" class="hand"></section>
      <main id="table">
        <svg id="board"></svg>
        <div id="boneyard"></div>
        <div id="history-bar" hidden></div>
        <div id="toast" hidden></div>
      </main>
      <section id="hand-bottom" class="hand"></section>
      <div id="overlay" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
