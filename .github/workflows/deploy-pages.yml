# Публикация игры на GitHub Pages: https://telesik.github.io/bonesai/
# Деплой идёт напрямую из Actions-артефакта — ветка gh-pages не используется,
# собранные файлы в git не попадают.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; новый пуш отменяет недоехавший предыдущий.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Сайт живёт на подпути /bonesai/, поэтому base передаётся флагом
      # только здесь — локальные npm run dev/build не затронуты.
      - name: Build
        working-directory: app
        run: |
          npm ci
          npm run build -- --base=/bonesai/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
