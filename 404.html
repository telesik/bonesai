<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dofodo</title>
<meta name="robots" content="noindex">
<script>
  // Старый адрес сайта /bonesai/… → тот же путь под новым именем /dofodo/…
  var p = location.pathname.replace(/^\/bonesai(\/|$)/, "/dofodo/");
  location.replace(location.origin + p + location.search + location.hash);
</script>
</head>
<body style="font-family:system-ui,sans-serif;margin:3rem;">
<p>The game is now called <strong>Dofodo</strong>. Redirecting to <a href="https://telesik.github.io/dofodo/">https://telesik.github.io/dofodo/</a>…</p>
</body>
</html>
